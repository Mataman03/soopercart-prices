name: מחירים לילי
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: קרפור וויקטורי מהמחשב בבית
        run: git fetch -q --depth=1 origin pc && git show FETCH_HEAD:pc.json.gz > pc.json.gz || echo "no pc data yet"
      - name: הורדת מחירים
        run: node run.js out
        env:
          PC_FILE: pc.json.gz
      - name: שמירה בענף data
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -q -m "prices $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: בדיקה שכל הרשתות ירדו
        run: node -e "const j=require('./out/prices.json');const p={...j.failed,...j.warnings};if(Object.keys(p).length){console.log(p);process.exit(1)}"
